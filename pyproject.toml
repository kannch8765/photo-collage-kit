[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-collage-kit"
version = "0.1.0"
description = "Reusable Pillow building blocks for photo-preserving collage art"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0"]
license = {text = "MIT"}
readme = "README.md"

[tool.setuptools.packages.find]
include = ["design_scripts*"]
